      <stop offset="0%" stop-color="#006a4e" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#006a4e"/>
      <stop offset="50%" stop-color="#f42a41"/>
      <stop offset="65%" stop-color="#00f5d4"/>
