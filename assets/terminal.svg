<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1321"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#9b5de5;#f15bb5;#00f5d4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#9b5de5">
        <animate attributeName="stop-color" values="#9b5de5;#f15bb5;#00f5d4;#9b5de5" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f15bb5">
        <animate attributeName="stop-color" values="#f15bb5;#00f5d4;#9b5de5;#f15bb5" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="836" height="246" rx="14"/>
    </clipPath>
  </defs>

  <!-- Card Background & Animated Neon Border -->
  <rect x="2" y="2" width="836" height="246" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Animated Scanline -->
  <g clip-path="url(#cardClip)" opacity="0.12">
    <rect x="0" y="0" width="840" height="4" fill="#00f5d4">
      <animate attributeName="y" values="-10;260" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Top Terminal Bar -->
  <rect x="2" y="2" width="836" height="36" rx="14" fill="#161b22"/>
  <rect x="2" y="24" width="836" height="14" fill="#161b22"/>
  <line x1="2" y1="38" x2="838" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="420" y="24" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold">
    waitvai@w8team: ~/termux-arsenal — zsh
  </text>

  <!-- Live Pulse Status -->
  <circle cx="755" cy="20" r="4.5" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="766" y="24" fill="#00f5d4" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold">
    ONLINE
  </text>

  <!-- Terminal Body -->
  <text x="26" y="68" fill="#00f5d4" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">
    $ whoami --verbose
  </text>

  <text x="26" y="94" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#9b5de5" font-weight="bold">Handle   :</tspan> WaitVai (W8Team)
  </text>
  <text x="26" y="118" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#9b5de5" font-weight="bold">Focus    :</tspan> Termux Tooling • AI Agents • Frida &amp; Android Security • Network Scanners
  </text>
  <text x="26" y="142" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#9b5de5" font-weight="bold">Stack    :</tspan> Python • TypeScript • Bash • Node.js • Frida JS • Docker
  </text>
  <text x="26" y="166" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#9b5de5" font-weight="bold">Channels :</tspan> t.me/W8TeamNew  |  t.me/W8Teams  |  youtube.com/@w8teams
  </text>
  <text x="26" y="190" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#9b5de5" font-weight="bold">Motto    :</tspan>
    <tspan fill="#f15bb5"> "Automate the impossible. Build for Termux &amp; beyond."</tspan>
  </text>

  <!-- Prompt + Blinking Cursor -->
  <text x="26" y="224" fill="#00f5d4" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">
    $ ./launch_w8team.sh --mode=active
  </text>
  <rect x="315" y="211" width="9" height="16" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
