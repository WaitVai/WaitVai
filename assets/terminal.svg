<svg xmlns="http://www.w3.org/2000/svg" width="840" height="265" viewBox="0 0 840 265" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070d12"/>
      <stop offset="50%" stop-color="#0a1916"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006a4e">
        <animate attributeName="stop-color" values="#006a4e;#f42a41;#00f5d4;#006a4e" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f42a41">
        <animate attributeName="stop-color" values="#f42a41;#00f5d4;#006a4e;#f42a41" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#006a4e;#f42a41;#00f5d4" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="836" height="261" rx="14"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="836" height="261" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Animated Scanline -->
  <g clip-path="url(#cardClip)" opacity="0.14">
    <rect x="0" y="0" width="840" height="4" fill="#00f5d4">
      <animate attributeName="y" values="-10;275" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Top Terminal Bar -->
  <rect x="2" y="2" width="836" height="36" rx="14" fill="#111b19"/>
  <rect x="2" y="24" width="836" height="14" fill="#111b19"/>
  <line x1="2" y1="38" x2="838" y2="38" stroke="#1f3b34" stroke-width="1"/>

  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>

  <!-- Mini Animated Bangladesh Flag Badge -->
  <rect x="90" y="12" width="24" height="16" rx="2" fill="#006a4e"/>
  <circle cx="101" cy="20" r="5" fill="#f42a41">
    <animate attributeName="r" values="4.6;5.3;4.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <text x="430" y="24" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold">
    waitvai@bd-w8team: ~/termux-arsenal — zsh
  </text>

  <!-- Pulsing ONLINE Status -->
  <circle cx="755" cy="20" r="4.5" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="766" y="24" fill="#00f5d4" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold">
    ONLINE
  </text>

  <!-- Terminal Body -->
  <text x="26" y="68" fill="#00f5d4" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">
    $ whoami --bd-edition
  </text>

  <text x="26" y="94" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#f42a41" font-weight="bold">Handle   :</tspan> WaitVai (W8Team)
  </text>
  <text x="26" y="118" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#f42a41" font-weight="bold">Origin   :</tspan> Dhaka, Bangladesh  [GMT+6]
  </text>
  <text x="26" y="142" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#f42a41" font-weight="bold">Focus    :</tspan> Termux Tooling • AI Agents • Frida &amp; Android Security • Scanners
  </text>
  <text x="26" y="166" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#f42a41" font-weight="bold">Stack    :</tspan> Python • TypeScript • Bash • Node.js • Frida JS • Docker
  </text>
  <text x="26" y="190" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#f42a41" font-weight="bold">Channels :</tspan> t.me/W8TeamNew  |  t.me/W8Teams  |  youtube.com/@w8teams
  </text>
  <text x="26" y="214" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#f42a41" font-weight="bold">Motto    :</tspan>
    <tspan fill="#00f5d4"> "From Bangladesh to the World — Automate Everything."</tspan>
  </text>

  <!-- Prompt + Blinking Cursor -->
  <text x="26" y="244" fill="#00f5d4" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">
    $ ./launch_w8team.sh --region=BD --mode=active
  </text>
  <rect x="414" y="231" width="9" height="16" fill="#f42a41">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
